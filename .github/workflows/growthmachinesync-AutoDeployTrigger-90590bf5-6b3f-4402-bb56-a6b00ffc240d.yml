name: Trigger auto deployment for growthmachinesync

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches:
      [ main ]
    paths:
    - 'sync-server-azure/**'
    - '.github/workflows/growthmachinesync-AutoDeployTrigger-90590bf5-6b3f-4402-bb56-a6b00ffc240d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GROWTHMACHINESYNC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GROWTHMACHINESYNC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GROWTHMACHINESYNC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          # Points the build at the sync-server-azure subfolder specifically
          # (this is a monorepo — the repo root has no Dockerfile, which is
          # why this fell back to Oryx buildpacks and failed instead of
          # using the real Dockerfile).
          appSourcePath: ${{ github.workspace }}/sync-server-azure
          dockerfilePath: Dockerfile
          # Switched from acrName (Azure AD token exchange via the
          # azure/login identity) to plain registry admin credentials —
          # the token-based `az acr login --expose-token` flow kept
          # failing generically even with AcrPush correctly granted to the
          # right identity (confirmed via its Azure role assignments), so
          # this sidesteps whatever was blocking that specific path.
          registryUrl: growthmachine.azurecr.io
          registryUsername: ${{ secrets.GROWTHMACHINESYNC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GROWTHMACHINESYNC_REGISTRY_PASSWORD }}
          imageToBuild: growthmachine.azurecr.io/growthmachinesync:${{ github.sha }}
          containerAppName: growthmachinesync
          resourceGroup: app-etnyre-supplier-prod_group
          targetPort: 8080


