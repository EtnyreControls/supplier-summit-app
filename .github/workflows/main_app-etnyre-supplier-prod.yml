name: Build and deploy Node.js app to Azure Web App - app-etnyre-supplier-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          cd main-app
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Assemble standalone deployment package
        run: |
          cd main-app
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/main-app/.next
          cp -r .next/static deploy/main-app/.next/static
          cp -r public deploy/main-app/public

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: main-app/deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EBF4BA4429FB4E87B27B46111EDD9379 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A4016BBED7C434AA33D400AB67E2D75 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CAE59CA1E1EB417B960A27D495E43F9A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-etnyre-supplier-prod'
          slot-name: 'Production'
          package: .
          
